<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>시선 — POETRY SPECTRUM</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brandButton" aria-label="전체 보기">
      <span class="brand-mark">詩</span>
      <span><strong>시선</strong><small>POETRY SPECTRUM</small></span>
    </button>
    <div class="top-actions">
      <span class="status"><i></i> Browser analysis</span>
      <button class="icon-button" id="themeButton" title="테마 전환" aria-label="테마 전환">◐</button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-head">
      <span>작품 목록</span><b id="poemCount">15</b>
    </div>
    <label class="search-box">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="제목 또는 시인">
    </label>
    <label class="select-box">
      <span class="sr-only">감정 필터</span>
      <select id="emotionFilter">
        <option value="">모든 감정</option>
      </select>
    </label>
    <div id="poemList" class="poem-list"></div>
  </aside>

  <main class="workspace">
    <nav class="tabs" aria-label="분석 영역">
      <button class="active" data-view="work">작품 분석</button>
      <button data-view="compare">감성 비교</button>
      <button data-view="custom">내 시 분석</button>
      <button data-view="method">분석 방법</button>
    </nav>
    <section id="workView" class="view"></section>
    <section id="compareView" class="view" hidden></section>
    <section id="customView" class="view" hidden></section>
    <section id="methodView" class="view" hidden></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
